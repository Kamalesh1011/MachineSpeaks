version: "3.9"
services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: machine_guardian_db
    environment:
      POSTGRES_DB: machine_guardian
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: machine_guardian_backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  timescaledb_data:
